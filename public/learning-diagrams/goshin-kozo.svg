<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="毫鍼の構造の模式図">
  <style>
    .t{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;}
    .h{font-weight:700;fill:#166534;}
    .lbl{font-weight:700;fill:#374151;}
    .sub{fill:#6b7280;}
    .metal{fill:#e5e7eb;stroke:#9ca3af;stroke-width:1.5;}
    .handle{fill:#fde68a;stroke:#d97706;stroke-width:1.5;}
    .lead{stroke:#9ca3af;stroke-width:1;}
  </style>
  <rect width="480" height="220" fill="#ffffff"/>
  <text class="t h" x="20" y="30" font-size="17">毫鍼の構造</text>

  <!-- 鍼柄（handle, coiled） -->
  <rect class="handle" x="60" y="92" width="90" height="16" rx="4"/>
  <line class="lead" x1="70" y1="92" x2="70" y2="108"/>
  <line class="lead" x1="82" y1="92" x2="82" y2="108"/>
  <line class="lead" x1="94" y1="92" x2="94" y2="108"/>
  <line class="lead" x1="106" y1="92" x2="106" y2="108"/>
  <line class="lead" x1="118" y1="92" x2="118" y2="108"/>
  <line class="lead" x1="130" y1="92" x2="130" y2="108"/>
  <line class="lead" x1="142" y1="92" x2="142" y2="108"/>
  <!-- 鍼頭 knob -->
  <circle class="handle" cx="58" cy="100" r="8"/>
  <!-- 鍼根 root -->
  <rect class="metal" x="150" y="97" width="10" height="6"/>
  <!-- 鍼体 body -->
  <rect class="metal" x="160" y="98" width="230" height="4"/>
  <!-- 鍼尖 tip -->
  <polygon class="metal" points="390,98 390,102 420,100"/>

  <!-- labels -->
  <line class="lead" x1="58" y1="80" x2="58" y2="62"/>
  <text class="t sub" x="58" y="54" font-size="12" text-anchor="middle">鍼頭</text>
  <line class="lead" x1="95" y1="90" x2="70" y2="140"/>
  <text class="t lbl" x="70" y="158" font-size="14" text-anchor="middle">鍼柄</text>
  <text class="t sub" x="70" y="174" font-size="10.5" text-anchor="middle">（持つ部分）</text>
  <line class="lead" x1="155" y1="112" x2="200" y2="150"/>
  <text class="t lbl" x="200" y="168" font-size="14" text-anchor="middle">鍼根</text>
  <text class="t sub" x="200" y="184" font-size="10.5" text-anchor="middle">（境目・折れやすい）</text>
  <line class="lead" x1="300" y1="102" x2="300" y2="130"/>
  <text class="t lbl" x="300" y="148" font-size="14" text-anchor="middle">鍼体</text>
  <line class="lead" x1="418" y1="100" x2="418" y2="62"/>
  <text class="t lbl" x="418" y="54" font-size="14" text-anchor="middle">鍼尖</text>
  <text class="t sub" x="418" y="38" font-size="10.5" text-anchor="middle">（先端）</text>
</svg>
