<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="末梢神経線維の分類の表">
  <style>
    .t{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;}
    .h{font-weight:700;fill:#166534;}
    .lbl{font-weight:700;fill:#374151;}
    .c{fill:#1f2937;}
    .box{fill:#fff;stroke:#d1d5db;stroke-width:1.2;}
    .head{fill:#ecfdf5;stroke:#a7f3d0;stroke-width:1.2;}
    .hi{fill:#fef9c3;stroke:#fde047;stroke-width:1.5;}
  </style>
  <rect width="480" height="300" fill="#ffffff"/>
  <text class="t h" x="20" y="28" font-size="16">末梢神経線維の分類（太い→細い）</text>

  <!-- header -->
  <rect class="head" x="20" y="42" width="70" height="34"/>
  <rect class="head" x="90" y="42" width="70" height="34"/>
  <rect class="head" x="160" y="42" width="90" height="34"/>
  <rect class="head" x="250" y="42" width="210" height="34"/>
  <text class="t lbl" x="55"  y="63" font-size="13" text-anchor="middle">線維</text>
  <text class="t lbl" x="125" y="63" font-size="13" text-anchor="middle">髄鞘</text>
  <text class="t lbl" x="205" y="63" font-size="13" text-anchor="middle">伝導速度</text>
  <text class="t lbl" x="355" y="63" font-size="13" text-anchor="middle">主な機能</text>

  <!-- rows -->
  <g font-size="12.5">
    <rect class="box" x="20" y="76" width="70" height="36"/><rect class="box" x="90" y="76" width="70" height="36"/><rect class="box" x="160" y="76" width="90" height="36"/><rect class="box" x="250" y="76" width="210" height="36"/>
    <text class="t c" x="55" y="99" text-anchor="middle">Aα</text><text class="t c" x="125" y="99" text-anchor="middle">有髄（太）</text><text class="t c" x="205" y="99" text-anchor="middle">最速</text><text class="t c" x="260" y="99">運動・固有感覚（Ia・Ib）</text>

    <rect class="box" x="20" y="112" width="70" height="34"/><rect class="box" x="90" y="112" width="70" height="34"/><rect class="box" x="160" y="112" width="90" height="34"/><rect class="box" x="250" y="112" width="210" height="34"/>
    <text class="t c" x="55" y="134" text-anchor="middle">Aβ</text><text class="t c" x="125" y="134" text-anchor="middle">有髄</text><text class="t c" x="205" y="134" text-anchor="middle">速い</text><text class="t c" x="260" y="134">触圧覚（ゲート制御で痛みを抑制）</text>

    <rect class="hi" x="20" y="146" width="70" height="34"/><rect class="hi" x="90" y="146" width="70" height="34"/><rect class="hi" x="160" y="146" width="90" height="34"/><rect class="hi" x="250" y="146" width="210" height="34"/>
    <text class="t c" x="55" y="168" text-anchor="middle">Aδ</text><text class="t c" x="125" y="168" text-anchor="middle">有髄（細）</text><text class="t c" x="205" y="168" text-anchor="middle">中等度</text><text class="t c" x="260" y="168">一次痛（鋭い痛み）・冷覚</text>

    <rect class="box" x="20" y="180" width="70" height="34"/><rect class="box" x="90" y="180" width="70" height="34"/><rect class="box" x="160" y="180" width="90" height="34"/><rect class="box" x="250" y="180" width="210" height="34"/>
    <text class="t c" x="55" y="202" text-anchor="middle">B</text><text class="t c" x="125" y="202" text-anchor="middle">有髄（細）</text><text class="t c" x="205" y="202" text-anchor="middle">遅い</text><text class="t c" x="260" y="202">自律神経の節前線維</text>

    <rect class="hi" x="20" y="214" width="70" height="34"/><rect class="hi" x="90" y="214" width="70" height="34"/><rect class="hi" x="160" y="214" width="90" height="34"/><rect class="hi" x="250" y="214" width="210" height="34"/>
    <text class="t c" x="55" y="236" text-anchor="middle">C</text><text class="t c" x="125" y="236" text-anchor="middle">無髄</text><text class="t c" x="205" y="236" text-anchor="middle">最遅</text><text class="t c" x="260" y="236">二次痛（鈍い痛み）・温覚・節後線維</text>
  </g>

  <text class="t" x="20" y="272" font-size="12" fill="#6b7280">※ 痛みを伝えるのは Aδ（一次痛）と C（二次痛）。B は細いが「有髄」。</text>
  <text class="t" x="20" y="290" font-size="12" fill="#6b7280">※ 無髄は C 線維のみ。節前＝B、節後＝C。</text>
</svg>
