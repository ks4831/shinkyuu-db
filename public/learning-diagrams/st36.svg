<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-label="足三里の位置（下腿前面）">
  <style>
    .t{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;}
    .h{font-weight:700;fill:#166534;}
    .leg{fill:#f9fafb;stroke:#9ca3af;stroke-width:2;}
    .bone{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:5 4;}
    .pt{fill:#16a34a;}
    .ring{fill:none;stroke:#16a34a;stroke-width:2;}
    .lbl{fill:#1f2937;font-weight:700;}
    .meas{stroke:#16a34a;stroke-width:1.2;}
  </style>
  <rect width="320" height="360" fill="#ffffff"/>
  <text class="t h" x="16" y="26" font-size="16">足三里（ST36）</text>

  <!-- knee + lower leg, front view -->
  <path class="leg" d="M110 40 Q98 60 100 90 L104 260 Q108 300 128 320 L170 320 Q192 300 196 260 L200 90 Q202 60 190 40 Q150 30 110 40 Z"/>
  <!-- patella -->
  <ellipse class="leg" cx="150" cy="62" rx="30" ry="22"/>
  <text class="t" x="150" y="66" font-size="11" text-anchor="middle" fill="#6b7280">膝蓋骨</text>

  <!-- 犢鼻 (lateral to patellar ligament) -->
  <circle class="pt" cx="172" cy="96" r="4"/>
  <text class="t" x="196" y="98" font-size="11" fill="#4b5563">犢鼻</text>

  <!-- tibial crest -->
  <path class="bone" d="M150 96 L150 300"/>
  <text class="t" x="120" y="220" font-size="11" fill="#9ca3af">脛骨前縁</text>

  <!-- 3寸 down from 犢鼻 -->
  <line class="meas" x1="172" y1="98" x2="172" y2="168"/>
  <line class="meas" x1="166" y1="98" x2="178" y2="98"/>
  <line class="meas" x1="166" y1="168" x2="178" y2="168"/>
  <text class="t" x="180" y="136" font-size="12" fill="#16a34a">3寸</text>

  <!-- 1横指外方 -->
  <line class="meas" x1="150" y1="176" x2="176" y2="176"/>
  <text class="t" x="150" y="196" font-size="11" fill="#16a34a">脛骨稜の外1横指</text>

  <!-- ST36 -->
  <circle class="pt" cx="176" cy="168" r="5"/>
  <circle class="ring" cx="176" cy="168" r="11"/>
  <text class="t lbl" x="196" y="166" font-size="13">足三里</text>

  <text class="t" x="16" y="345" font-size="11" fill="#6b7280">犢鼻の下3寸・脛骨稜の外1横指。合土穴＝胃の下合穴。</text>
</svg>
