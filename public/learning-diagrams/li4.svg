<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" role="img" aria-label="合谷の位置（手背）">
  <style>
    .t{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;}
    .h{font-weight:700;fill:#166534;}
    .hand{fill:#f9fafb;stroke:#9ca3af;stroke-width:2;}
    .bone{stroke:#cbd5e1;stroke-width:2;}
    .pt{fill:#16a34a;}
    .ring{fill:none;stroke:#16a34a;stroke-width:2;}
    .lbl{fill:#1f2937;font-weight:700;}
    .meas{stroke:#16a34a;stroke-width:1.2;}
  </style>
  <rect width="340" height="300" fill="#ffffff"/>
  <text class="t h" x="16" y="26" font-size="16">合谷（LI4）</text>

  <!-- dorsum of right hand, thumb to the left -->
  <path class="hand" d="M60 150
    Q55 120 80 110 L120 96 L120 60 Q122 44 136 44 Q150 44 152 60 L152 92
    L168 90 L168 50 Q170 36 184 36 Q198 36 200 50 L200 92
    L216 96 L216 58 Q218 46 230 46 Q242 46 244 58 L244 100
    L258 108 L258 78 Q260 68 270 68 Q280 68 282 80 L282 130
    Q285 200 250 240 Q200 275 140 262 Q80 248 62 200 Z"/>
  <!-- thumb -->
  <path class="hand" d="M62 150 Q30 150 22 178 Q16 200 34 214 Q52 226 78 214 L96 190 Q88 168 80 158 Z"/>

  <!-- 2nd metacarpal (index side) -->
  <line class="bone" x1="118" y1="150" x2="150" y2="96"/>
  <text class="t" x="150" y="150" font-size="11" fill="#9ca3af">第2中手骨</text>

  <!-- midpoint marker -->
  <line class="meas" x1="118" y1="150" x2="150" y2="96"/>
  <circle class="pt" cx="118" cy="150" r="5"/>
  <circle class="ring" cx="118" cy="150" r="11"/>
  <text class="t lbl" x="70" y="112" font-size="13">合谷</text>
  <text class="t" x="24" y="128" font-size="11" fill="#4b5563">第2中手骨の</text>
  <text class="t" x="24" y="142" font-size="11" fill="#4b5563">中点・母指側</text>

  <text class="t" x="16" y="286" font-size="11" fill="#6b7280">大腸経の原穴。四総穴（面口）。妊婦への使用は慎重に。</text>
</svg>
