<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-label="背部兪穴と椎骨の高さ">
  <style>
    .t{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;}
    .h{font-weight:700;fill:#166534;}
    .spine{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1.5;}
    .vert{fill:#e5e7eb;stroke:#9ca3af;stroke-width:1;}
    .pt{fill:#16a34a;}
    .lbl{fill:#1f2937;font-weight:700;}
    .note{fill:#b45309;font-weight:700;}
    .line{stroke:#cbd5e1;stroke-width:1;}
  </style>
  <rect width="480" height="440" fill="#ffffff"/>
  <text class="t h" x="20" y="26" font-size="17">背部兪穴と椎骨の高さ</text>
  <text class="t" x="20" y="44" font-size="12" fill="#6b7280">すべて後正中線の外方1.5寸</text>

  <!-- spine column -->
  <rect class="spine" x="196" y="56" width="24" height="340" rx="6"/>
  <!-- vertebra ticks -->
  <g>
    <!-- rows: y, vertebra, point -->
    <g font-size="12.5">
      <line class="line" x1="220" y1="86"  x2="300" y2="86"/>
      <circle class="pt" cx="224" cy="86" r="4"/>
      <text class="t lbl" x="304" y="90">肺兪 ＝ 第3胸椎（肩甲棘の高さ）</text>

      <line class="line" x1="220" y1="120" x2="300" y2="120"/>
      <circle class="pt" cx="224" cy="120" r="4"/>
      <text class="t lbl" x="304" y="124">心兪 ＝ 第5胸椎</text>

      <line class="line" x1="220" y1="154" x2="300" y2="154"/>
      <circle class="pt" cx="224" cy="154" r="4"/>
      <text class="t lbl" x="304" y="158">膈兪 ＝ 第7胸椎（肩甲骨下角）</text>

      <line class="line" x1="220" y1="190" x2="300" y2="190"/>
      <circle class="pt" cx="224" cy="190" r="4"/>
      <text class="t lbl" x="304" y="194">肝兪 ＝ 第9胸椎</text>

      <line class="line" x1="220" y1="224" x2="300" y2="224"/>
      <circle class="pt" cx="224" cy="224" r="4"/>
      <text class="t lbl" x="304" y="228">脾兪 ＝ 第11胸椎</text>

      <line class="line" x1="220" y1="252" x2="300" y2="252"/>
      <circle class="pt" cx="224" cy="252" r="4"/>
      <text class="t lbl" x="304" y="256">胃兪 ＝ 第12胸椎</text>

      <line class="line" x1="220" y1="300" x2="300" y2="300"/>
      <circle class="pt" cx="224" cy="300" r="4"/>
      <text class="t lbl" x="304" y="304">腎兪 ＝ 第2腰椎</text>
      <text class="t note" x="304" y="320" font-size="11">（督脈・命門と同じ高さ）</text>

      <line class="line" x1="220" y1="352" x2="300" y2="352"/>
      <circle class="pt" cx="224" cy="352" r="4"/>
      <text class="t lbl" x="304" y="356">大腸兪 ＝ 第4腰椎</text>
      <text class="t note" x="304" y="372" font-size="11">（ヤコビー線の高さ）</text>
    </g>
  </g>

  <!-- left labels: regions -->
  <text class="t" x="30" y="110" font-size="12" fill="#6b7280">胸椎</text>
  <text class="t" x="30" y="320" font-size="12" fill="#6b7280">腰椎</text>

  <text class="t" x="20" y="420" font-size="12" fill="#6b7280">※ 椎骨の高さは目安。募穴（腹部）と俞募配穴で覚えると効率的。</text>
</svg>
